# InterTime Casino
# Економіка монет:
#   auto     - гроші сервера через Vault (Essentials), якщо Vault немає - внутрішні монети
#   vault    - тільки гроші сервера
#   internal - тільки внутрішні монети казино
economy: auto

# Скільки монет дають за 1 предмет при обміні в меню
exchange:
  diamond: 100
  netherite: 1000

# Стартовий баланс монет для нових гравців
start-balance: 1000

# ============================ РУЛЕТКА БЛОКІВ ============================
# Порядок: Вугілля, Мідь, Залізо, Золото, Алмаз, Смарагд
# multipliers - множник виплати (0 = ставка згорає, 1 = повернення ставки)
# weights     - вага випадіння (чим більше, тим частіше). Шанс = вага / сума ваг.
roulette:
  multipliers: [0, 0.75, 1, 1.5, 2, 3]
  weights: [25, 22, 20, 16, 12, 5]
